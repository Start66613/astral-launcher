name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

# 同一个分支重复推送时，取消上一轮还在跑的构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 本机与 CI 都可能遇到 MSVC 命令行过长（ring 的 C 编译），关掉调试信息最省事
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  web:
    name: 前端类型检查 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: TypeScript 检查
        working-directory: app
        run: pnpm exec tsc --noEmit

      - name: 前端构建
        working-directory: app
        run: pnpm exec vite build

  rust:
    name: Rust 格式 + Lint + 构建 + 自检
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # tauri::generate_context! 在编译期就要读 dist，所以先构建前端
      - name: 构建前端
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build

      # 挡住"写了命令却忘了注册"这类错误（V2 开发中真实发生过 16 个）
      - name: 校验命令注册
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check-commands.ps1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: 格式检查
        working-directory: app/src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo check
        working-directory: app/src-tauri
        run: cargo check --release

      - name: 构建
        working-directory: app/src-tauri
        run: cargo build --release

      # 自检退出码 = 失败项数，非 0 即失败
      - name: 运行 --selftest
        working-directory: app/src-tauri
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\target\release\astral.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path "$env:TEMP\astral-selftest.log") {
            Get-Content "$env:TEMP\astral-selftest.log" | Select-Object -Last 5
          }
          if (Test-Path "$env:TEMP\astral-selftest.json") {
            Get-Content "$env:TEMP\astral-selftest.json" -Raw
          }
          if ($p.ExitCode -ne 0) { Write-Error "selftest failed: $($p.ExitCode)"; exit 1 }

      # 单元测试：6 个真实联网的用例标了 #[ignore]，这里不跑，避免 CI 被网络抖动拖垮
      - name: 单元测试
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-tests.ps1

  audit:
    name: 依赖安全审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 用官方 action：有漏洞才失败，只提示"未维护"这类警告时不算失败，
      # 免得上游发一条 unmaintained 通知就把整个 CI 卡红。
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: app/src-tauri