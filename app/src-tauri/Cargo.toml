[package]
name = "astral"
version = "0.1.0"
description = "Astral Launcher"
edition = "2021"
rust-version = "1.77"

[lib]
name = "astral_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
portablemc = { path = "vendor/portablemc" }
uuid = { version = "1", features = ["v3"] }
zip = "9"
sha1 = "0.10"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
